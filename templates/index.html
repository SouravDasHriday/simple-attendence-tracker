<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Attendance Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
        h1, h2 { color: #333; }
        form { background: #f4f4f4; padding: 20px; border-radius: 5px; margin-bottom: 20px; }
        input[type="text"], select { width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; }
        button { background: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #218838; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <h1>📋 Attendance Tracker</h1>
    
    <form action="/check-in" method="POST">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter full name" required>
        
        <label for="status">Status:</label>
        <select id="status" name="status">
            <option value="Present">Present</option>
            <option value="Late">Late</option>
            <option value="Excused">Excused</option>
        </select>
        
        <button type="submit">Submit Attendance</button>
    </form>

    <h2>Log History</h2>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Date</th>
                <th>Time</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            {% for row in records %}
            <tr>
                <td>{{ row[0] }}</td>
                <td>{{ row[1] }}</td>
                <td>{{ row[2] }}</td>
                <td>{{ row[3] }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="4" style="text-align: center;">No records logged yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
