apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-attendance-tracker
  labels:                                 # Fixed: lables -> labels
    app: simple-attendance-tracker
spec:
  replicas: 2
  selector:
    matchLabels:                          # Fixed: matchLevels -> matchLabels
      app: simple-attendance-tracker
  template:                               # Added: template block
    metadata:
      labels:                             # Added: Pod labels (must match selector)
        app: simple-attendance-tracker
    spec:
      containers:
        - name: simple-attendence-tracker
          image: souravdasdocker/simple-attendence-tracker:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
